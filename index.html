    <meta charset="UTF-8" />

  <body>
    <main>
      <section class="hero-section">
        <div class="container hero-section__container">
          <h1 class="hero-section__title">
            Ласкаво просимо <br />у світ Гаррі Поттера
          </h1>
          <button type="button" class="hero-section__btn" id="hero-section-btn">
            Показати всіх персонажів
          </button>
        </div>
      </section>
      <section class="categories-section is-hidden" id="categories-section">
        <div class="container categories-section__container">
          <ul class="categories-list">
            <li class="characters-type-card">
              <img
                class="characters-type-img"
                src="/src/assets/type-students-card.jpg"
                srcset="
                  /src/assets/type-students-card.jpg    1x,
                  /src/assets/type-students-card@2x.jpg 2x
                "
                alt="Студенти Гоґвортсу"
              />
              <button
                type="button"
                class="characters-type-btn"
                id="students-btn"
              >
                Студенти Гоґвортсу
              </button>
            </li>
            <li class="characters-type-card">
              <img
                class="characters-type-img"
                src="/src/assets/type-employees-card.jpg"
                srcset="
                  /src/assets/type-employees-card.jpg    1x,
                  /src/assets/type-employees-card@2x.jpg 2x
                "
                alt="Співробітники Гоґвортсу"
              />
              <button
                type="button"
                class="characters-type-btn"
                id="employees-btn"
              >
                Співробітники Гоґвортсу
              </button>
            </li>
            <li class="characters-type-card">
              <img
                class="characters-type-img"
                src="/src/assets/type-by-faculty-card.jpg"
                srcset="
                  /src/assets/type-by-faculty-card.jpg    1x,
                  /src/assets/type-by-faculty-card@2x.jpg 2x
                "
                alt="Персонажі в певному будинку"
              />
              <button
                type="button"
                class="characters-type-btn"
                id="faculties-btn"
              >
                Персонажі в певному будинку
              </button>
            </li>
          </ul>
        </div>
      </section>
      <section class="characters-section is-hidden" id="characters-section">
        <div class="container characters-section__container">
          <h2 class="section-title">Студенти Гоґвортсу</h2>
          <div class="faculty-filter is-hidden" id="faculty-filter">
            <button class="faculty-btn active" data-faculty="gryffindor">
              <img
                class="faculty-btn-icon"
                src="/src/assets/gryffindor-logo.svg"
                alt="Gryffindor logo"
              />
              <span>Gryffindor</span>
            </button>
            <button class="faculty-btn" data-faculty="slytherin">
              <img
                class="faculty-btn-icon"
                src="/src/assets/slytherin-logo.svg"
                alt="Slytherin logo"
              />
              <span>Slytherin</span>
            </button>
            <button class="faculty-btn" data-faculty="ravenclaw">
              <img
                class="faculty-btn-icon"
                src="/src/assets/ravenclaw-logo.svg"
                alt="Ravenclaw logo"
              />
              <span>Ravenclaw</span>
            </button>
            <button class="faculty-btn" data-faculty="hufflepuff">
              <img
                class="faculty-btn-icon"
                src="/src/assets/hufflepuff-logo.svg"
                alt="Hufflepuff logo"
              />
              <span>Hufflepuff</span>
            </button>
          </div>
